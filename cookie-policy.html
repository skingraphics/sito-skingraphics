<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Cookie Policy — Skingraphics</title>
<link rel="icon" href="img/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mona+Sans:wdth,wght@75..125,300..900&family=Playfair+Display:ital,wght@1,500..800&display=swap">
<style>
:root{--ink:#161616;--cream:#f4f2ee;--red:#e31e24;--line:rgba(22,22,22,.14)}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--cream);color:var(--ink);font-family:"Mona Sans",system-ui,sans-serif;font-size:16.5px;line-height:1.6}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:18px 4vw;background:rgba(244,242,238,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header img{height:34px;display:block}
header a.btn{height:44px;border-radius:8px;background:var(--red);color:#fff;display:inline-flex;align-items:center;padding:0 16px;font-weight:800;font-size:14px;text-transform:uppercase;text-decoration:none}
main{max-width:860px;margin:0 auto;padding:9vh 6vw 14vh}
.eb{font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--red);margin-bottom:14px}
h2{font-variation-settings:"wdth" 93;font-weight:800;font-size:clamp(40px,7vw,78px);line-height:.92;letter-spacing:-2px;text-transform:uppercase;margin:0 0 26px}
h3{font-size:20px;font-weight:750;text-transform:uppercase;letter-spacing:-.2px;margin:44px 0 10px;padding-top:22px;border-top:1px solid var(--line)}
h4{font-size:17px;margin:26px 0 8px}
p,li{max-width:72ch}em{font-family:"Playfair Display",serif;font-style:italic;color:#4e4c49}
h2+p em{font-size:17px}
a{color:var(--red);text-underline-offset:3px}
ul,ol{padding-left:20px}li{margin:6px 0}
.tw{overflow-x:auto;margin:16px 0}
table{border-collapse:collapse;width:100%;font-size:15px}th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:12.5px;text-transform:uppercase;letter-spacing:.6px;color:#4e4c49}
.upd{margin-top:50px;font-size:13.5px;color:#7a766f}
footer{padding:26px 4vw;border-top:1px solid var(--line);font-size:13px;color:#7a766f;display:flex;gap:18px;flex-wrap:wrap;justify-content:space-between}
footer a{color:inherit}
</style>
</head>
<body data-doc="cookie">
<header><a href="/"><img src="img/logo.svg" alt="skin"></a><a class="btn" href="/#footer">Contatti</a></header>
<main><div class="eb">← <a href="/" style="color:inherit;text-decoration:none">Torna al sito</a></div><div id="legal"></div></main>
<footer><span>SKIN SRL · P.IVA 03699980797</span><span><a href="/privacy">Privacy Policy</a> · <a href="/cookie-policy">Cookie Policy</a></span></footer>
<script src="config.js"></script>
<script src="seed.js"></script>
<script src="legal.js"></script>
</body>
</html>
